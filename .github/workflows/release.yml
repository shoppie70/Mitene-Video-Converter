name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install DMG tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild-venv"
          "$RUNNER_TEMP/dmgbuild-venv/bin/pip" install --upgrade pip dmgbuild
          echo "$RUNNER_TEMP/dmgbuild-venv/bin" >> "$GITHUB_PATH"

      - name: Build Universal app
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}" OUTPUT_DIR="$GITHUB_WORKSPACE/dist" ./scripts/build_app.sh

      - name: Build and verify DMG
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}" APP_PATH="$GITHUB_WORKSPACE/dist/2分にしてね.app" OUTPUT_DIR="$GITHUB_WORKSPACE/dist" ./scripts/build_dmg.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/MiteneVideoConverter-v*.dmg
